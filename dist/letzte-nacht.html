<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letzte Nacht">
<title>Letzte Nacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Aussehen der Menüs und der Anzeige oben. Spielgrafik-Farben: js/config/look.js */
:root{
  --veil:rgba(12,15,24,.9); --card:#eceae4; --cardink:#1b1d24; --cardmuted:#5c5f69; --line:#c9c6bd;
  --accent:#d8432f; --gold:#e9a23b; --sec:#2b3040; --secink:#eceae4; --hud:#f3efe6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --veil:rgba(6,8,13,.92); --card:#1e222c; --cardink:#f1ece2; --cardmuted:#9a978f; --line:#30353f; --accent:#ff5a42; --gold:#f2b14d; --sec:#2b3040; --secink:#eceae4; --hud:#f3efe6; color-scheme:dark; }
}
:root[data-theme="dark"]{ --veil:rgba(6,8,13,.92); --card:#1e222c; --cardink:#f1ece2; --cardmuted:#9a978f; --line:#30353f; --accent:#ff5a42; --gold:#f2b14d; --sec:#2b3040; --secink:#eceae4; --hud:#f3efe6; color-scheme:dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; background:#141a1a; overflow:hidden; }
body{ font-family:Rubik, system-ui, sans-serif; -webkit-user-select:none; user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
canvas#cv{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.hidden{ display:none !important; }
#hud{ position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0; pointer-events:none; color:var(--hud); text-shadow:0 2px 4px rgba(0,0,0,.8); z-index:5; }
#xpbar{ height:9px; background:rgba(255,255,255,.14); border-radius:5px; overflow:hidden; }
#xpfill{ height:100%; width:0; background:linear-gradient(90deg,#3f9bff,#a46bff); }
#hudrow{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-weight:700; font-size:15px; }
#time{ font-family:Bungee, Rubik, sans-serif; font-size:24px; }
#hudrow2{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; padding-right:52px; }
#slots{ display:flex; gap:4px; }
#slots div{ position:relative; }
#slots img{ width:26px; height:26px; display:block; }
#slots b{ position:absolute; right:-2px; bottom:-3px; font-size:10px; background:#111; color:#fff; border-radius:6px; padding:0 3px; }
#rgold{ display:flex; align-items:center; gap:4px; font-weight:700; font-size:15px; }
.ci{ width:18px; height:18px; vertical-align:-3px; }
#pause{ position:fixed; right:12px; top:calc(env(safe-area-inset-top,0px) + 46px); z-index:6; width:42px; height:42px; border-radius:50%; border:0; background:rgba(0,0,0,.45); color:#fff; font:700 15px Rubik, sans-serif; letter-spacing:1px; }
#banner{ position:fixed; left:0; right:0; top:28%; text-align:center; z-index:5; pointer-events:none; font-family:Bungee, Rubik, sans-serif; font-size:30px; color:var(--gold); text-shadow:0 0 18px rgba(0,0,0,.95),0 3px 0 rgba(0,0,0,.6); opacity:0; transition:opacity .3s, transform .3s; transform:scale(.9); }
#banner.on{ opacity:1; transform:scale(1); }
#veil{ position:fixed; inset:0; background:var(--veil); z-index:10; display:flex; align-items:center; justify-content:center; overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px); touch-action:pan-y; }
.box{ width:100%; max-width:400px; text-align:center; color:#f1ece2; margin:auto; }
.box h1{ font-family:Bungee, Rubik, sans-serif; font-weight:400; font-size:48px; line-height:.95; margin:0 0 8px; color:var(--accent); text-shadow:0 4px 0 rgba(0,0,0,.55); }
.box h2{ font-family:Bungee, Rubik, sans-serif; font-weight:400; font-size:28px; margin:0 0 14px; color:var(--gold); }
.box p{ font-size:16px; line-height:1.5; color:#cfcabe; margin:8px 0; }
.box .stat{ font-size:20px; color:#f1ece2; font-weight:700; }
.box .small{ font-size:14px; color:#9a978f; }
.portrait{ width:110px; height:110px; display:block; margin:6px auto 2px; }
.goldline{ display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:20px; color:var(--gold); margin:4px 0 6px; }
.goldline img{ width:24px; height:24px; }
button{ font:inherit; cursor:pointer; }
.go{ margin-top:14px; width:100%; border:0; border-radius:14px; padding:16px; font:700 20px Rubik, system-ui, sans-serif; background:var(--accent); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.35); }
.go:active,.sec:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.sec{ border:0; border-radius:12px; padding:13px; font:700 16px Rubik, sans-serif; background:var(--sec); color:var(--secink); box-shadow:0 4px 0 rgba(0,0,0,.35); }
.link{ background:none; border:0; color:#9a978f; font:500 15px Rubik, sans-serif; padding:10px; margin-top:6px; text-decoration:underline; text-underline-offset:3px; }
.list{ display:grid; gap:10px; text-align:left; }
.item{ display:flex; gap:12px; align-items:center; border-radius:14px; padding:12px 14px; background:var(--card); color:var(--cardink); box-shadow:0 4px 0 rgba(0,0,0,.35); border:0; width:100%; text-align:left; }
button.item:active{ transform:translateY(2px); }
.item img{ width:46px; height:46px; flex:none; }
.item .tx{ flex:1; min-width:0; }
.item b{ display:block; font-size:17px; }
.item .d{ display:block; font-size:13.5px; color:var(--cardmuted); margin-top:2px; line-height:1.35; }
.item .lv{ font-size:13px; color:var(--cardmuted); white-space:nowrap; }
.item.sel{ outline:3px solid var(--gold); }
.buy{ border:0; border-radius:10px; padding:9px 11px; font:700 14px Rubik, sans-serif; background:var(--gold); color:#1b1d24; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
.buy img{ width:15px; height:15px; }
.buy:disabled{ opacity:.4; }
.buy.ok{ background:var(--sec); color:var(--secink); }
.pips{ display:flex; gap:3px; margin-top:5px; }
.pips i{ width:14px; height:5px; border-radius:3px; background:var(--line); }
.pips i.f{ background:var(--gold); }
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div id="hudrow"><span id="lvl">Stufe 1</span><span id="time">0:00</span><span id="kills">0 Kills</span></div>
  <div id="hudrow2"><div id="slots"></div><span id="rgold"></span></div>
</div>
<button id="pause" class="hidden" aria-label="Pause">II</button>
<div id="banner"></div>
<div id="veil"><div class="box" id="box"></div></div>

<script>
(()=>{
'use strict';
// ===== config/balance.js =====
// ============================================================

    coinChance: 0.09, healChance: 0.012, magnetChance: 0.006, bombChance: 0.004,
    healPercent: 0.3,   // Hähnchen/Medikit heilt 30 % deines Max-Lebens

// ===== config/enemies.js =====

//  appearsAfter = ab Sekunde X dabei

// Der Boss kommt nach Zeitplan (siehe balance.js → boss)
const BOSS = { name: 'Riese', hp: 1500, speed: 46, damage: 30, xp: 40, radius: 44 };

// ===== config/weapons.js =====
// ============================================================
//  WAFFEN
//  Listen wie [a, b, c, d, e] = Wert für Stufe 1 bis 5.
//  Einzelne Zahl = gilt für alle Stufen.
//  cooldown = Sekunden zwischen zwei Angriffen (kleiner = schneller)
// ============================================================
const WEAPONS = {
  revolver: {
    name: 'Revolver', desc: 'Schießt auf den nächsten Zombie', upgrade: 'Mehr Schaden, mehr Kugeln',

    spread: 0.32, speedMin: 600, speedMax: 780, lifeMin: 0.28, lifeMax: 0.38, knockback: 16, range: 320,
  },
  flamer: {

    length: [126, 142, 158, 174, 190], damage: [5.2, 7.4, 9.6, 11.8, 14], tick: 0.13, cone: 0.42,
  },
  boomerang: {

    cooldown: [1.58, 1.46, 1.34, 1.22, 1.1], damage: [17, 22, 27, 32, 37], count: [1, 1, 2, 2, 2],

// ===== config/passives.js =====
// ============================================================
//  PASSIVE UPGRADES (beim Stufenaufstieg wählbar)
//  op: 'mul' = malnehmen (1.15 = +15 %), 'add' = dazuzählen

// ============================================================

// ===== config/characters.js =====
// ============================================================
//  CHARAKTERE
//  weapon = Startwaffe (Name aus weapons.js)
//  price  = Gold zum Freischalten (0 = gratis)
//  bonus  = wie bei passives.js
//  hat    = cowboy | hardhat | mask | medic | beanie
// ============================================================
const CHARACTERS = [
  { id: 'jack', name: 'Jack', title: 'Cowboy',        bonusText: '+10 % Schaden',               weapon: 'revolver', price: 0,
    bonus: [{ stat: 'dmgMul', op: 'mul', value: 1.1 }],  look: { skin: '#e8b48a', shirt: '#b5462f', pants: '#3b4a6b', hat: 'cowboy' } },
  { id: 'mia',  name: 'Mia',  title: 'Mechanikerin',  bonusText: '+20 % Wirkungsbereich',       weapon: 'saws',     price: 250,
    bonus: [{ stat: 'area', op: 'mul', value: 1.2 }],    look: { skin: '#c98c64', shirt: '#3f7fa8', pants: '#2f3a4a', hat: 'hardhat' } },
  { id: 'paul', name: 'Paul', title: 'Pyro',          bonusText: '+30 Leben',                   weapon: 'flamer',   price: 500,
    bonus: [{ stat: 'max', op: 'add', value: 30 }],      look: { skin: '#e3b08c', shirt: '#5d6b3a', pants: '#3a3326', hat: 'mask' } },
  { id: 'sina', name: 'Sina', title: 'Sanitäterin',   bonusText: 'Heilt 1,5 Leben pro Sekunde', weapon: 'zap',      price: 800,
    bonus: [{ stat: 'regen', op: 'add', value: 1.5 }],   look: { skin: '#f0c4a0', shirt: '#e8e6e0', pants: '#4a5a6a', hat: 'medic' } },
  { id: 'bob',  name: 'Bob',  title: 'Sprengmeister', bonusText: '−15 % Abklingzeit',           weapon: 'grenade',  price: 1200,
    bonus: [{ stat: 'cdMul', op: 'mul', value: 0.85 }],  look: { skin: '#d9a07a', shirt: '#6b4a2b', pants: '#2e2e33', hat: 'beanie' } },
];

// ===== config/shop.js =====
// ============================================================
//  WERKSTATT (dauerhafte Upgrades für Gold)
//  price = Preis der ersten Stufe, jede weitere kostet × PRICE_GROWTH
//  effect wird pro gekaufter Stufe einmal angewendet
// ============================================================
const SHOP_PRICE_GROWTH = 1.8;

const SHOP = [
  { id: 'might',  icon: 'might',  name: 'Stärke',        desc: '+5 % Schaden pro Stufe',         max: 5, price: 60,  effect: { stat: 'dmgMul',  op: 'add', value: 0.05 } },
  { id: 'vital',  icon: 'vital',  name: 'Vitalität',     desc: '+10 Leben pro Stufe',            max: 5, price: 60,  effect: { stat: 'max',     op: 'add', value: 10 } },
  { id: 'speed',  icon: 'speed',  name: 'Ausdauer',      desc: '+4 % Tempo pro Stufe',           max: 5, price: 50,  effect: { stat: 'speed',   op: 'mul', value: 1.04 } },
  { id: 'magnet', icon: 'magnet', name: 'Anziehung',     desc: '+10 % Sammelradius pro Stufe',   max: 5, price: 40,  effect: { stat: 'magnet',  op: 'mul', value: 1.1 } },
  { id: 'greed',  icon: 'greed',  name: 'Gier',          desc: '+15 % Gold pro Stufe',           max: 5, price: 80,  effect: { stat: 'goldMul', op: 'add', value: 0.15 } },
  { id: 'revive', icon: 'revive', name: 'Zweites Leben', desc: 'Einmal pro Runde wiederbeleben', max: 1, price: 600, special: 'revive' },
];

// ===== config/look.js =====
// ============================================================
//  AUSSEHEN – alle Farben an einem Ort (Hex-Farbcodes)
// ============================================================
const LOOK = {
  outline: '#0f1118',
  eyes: '#ff4a36',
  zombies: [
    { skin: '#86ad6c', shirt: '#5a4b6e', pants: '#3b3a44' },
    { skin: '#97b07c', shirt: '#6e5040', pants: '#44392e' },
    { skin: '#73a07a', shirt: '#3f5a6e', pants: '#2f3b40' },
  ],
  dog: { fur: '#4b4039', dark: '#3a312b', snout: '#5a4d44' },
  bat: { wing: '#3b2f4a', body: '#4a3b5c' },
  brute: { skin: '#7d8f6a', body: '#5f4f6e', pants: '#34303a' },
  boss: { body: '#8e2b24', belly: '#b8443a', feet: '#4a1612', horns: '#e8dcc2', eyes: '#ffd84a' },
  gems: { small: '#4fa3ff', mid: '#b77cff', big: '#f2b14d' },
  coin: '#f2b94a',
  ground: {

};

// ===== config/sound.js =====
// ============================================================
//  SOUND & MUSIK (alles wird live erzeugt, keine Dateien)
// ============================================================
const SOUND = {
  master: 0.6, effects: 0.8, music: 0.32,
  tempo: 0.24,          // Sekunden pro Musik-Schritt (kleiner = schneller)

  lateAfter: 180,

};

// ===== config/texts.js =====
// ============================================================
//  TEXTE – alles, was der Spieler liest
// ============================================================
const TEXT = {
  title: 'Letzte<br>Nacht',
  play: 'Spielen', characters: 'Charaktere', shop: 'Werkstatt', back: 'Zurück',
  shopSub: 'Dauerhafte Verbesserungen für jede Runde.',
  record: 'Rekord', survived: 'überlebt', kills: 'Kills', level: 'Stufe',
  soundOn: 'Ton: an', soundOff: 'Ton: aus',
  pause: 'Pause', resume: 'Weiter', giveUp: 'Aufgeben',
  dead: 'Gefressen', again: 'Nochmal!', menu: 'Menü', newRecord: 'Neuer Rekord!',
  newWeapon: 'Neue Waffe', isNew: 'Neu', chosen: 'Gewählt', choose: 'Wählen', done: 'Fertig', startsWith: 'Startet mit',

  bossComing: 'Ein Riese kommt!', bossDead: 'Riese erledigt!', swarm: 'Fledermausschwarm!',
  magnet: 'Alles einsammeln!', bomb: 'BUMM!', revive: 'Zweites Leben!',
};

// ===== engine/util.js =====
// Kleine Hilfsfunktionen, die überall gebraucht werden
const $ = id => document.getElementById(id);

function rollOptions() {
  const Lm = BALANCE.limits, pool = [];

  if (Object.keys(G.W).length < Lm.maxWeapons) for (const id in WEAPONS) if (!G.W[id]) pool.push({ k: 'w', id, wt: 2 });
  for (const id in PASSIVES) if ((G.PL[id] || 0) < Lm.maxPassiveLevel) pool.push({ k: 'p', id, wt: 2 });
  const out = [];
  while (out.length < 3 && pool.length) {
    let r = Math.random() * pool.reduce((s, o) => s + o.wt, 0), i = 0;
    while (i < pool.length - 1 && r > pool[i].wt) { r -= pool[i].wt; i++; }

  return out;

// Wie jede Waffe funktioniert. Die ZAHLEN stehen in config/weapons.js.
// Neue Waffe? → hier einen Block "if (id === 'neu')" ergänzen + Eintrag in config/weapons.js + Symbol in graphics/icons.js






function updWeapons(dt) {
  const P = G.P, S = G.S;
  for (const id in G.W) {
    const w = G.W[id], L = w.lvl, C = WEAPONS[id]; w.cd -= dt;

    if (id === 'revolver' && w.cd <= 0) {
      const tg = nearest(P.x, P.y, Math.max(view.w, view.h) * C.range); if (!tg) { w.cd = .1; continue; }
      const n = lv(C.bullets, L), a = Math.atan2(tg.y - P.y, tg.x - P.x); P.face = Math.cos(a) < 0 ? -1 : 1;
      for (let i = 0; i < n; i++) { const aa = a + (i - (n - 1) / 2) * C.spread; G.bullets.push({ x: P.x + Math.cos(aa) * 16, y: P.y - 4 + Math.sin(aa) * 16, vx: Math.cos(aa) * C.speed, vy: Math.sin(aa) * C.speed, life: C.lifetime, pierce: lv(C.pierce, L), dmg: lv(C.damage, L), kb: C.knockback, hit: new Set(), col: '#ffe2a0', r: 3.6 }); }
      G.lights.push({ x: P.x + Math.cos(a) * 20, y: P.y + Math.sin(a) * 20, r: 90, life: .06, max: .06, warm: true });
      w.cd = lv(C.cooldown, L) * S.cdMul; sfx('shot');
    }
    if (id === 'shotgun' && w.cd <= 0) {
      const tg = nearest(P.x, P.y, C.range); if (!tg) { w.cd = .1; continue; }
      const n = lv(C.pellets, L), a = Math.atan2(tg.y - P.y, tg.x - P.x); P.face = Math.cos(a) < 0 ? -1 : 1;
      for (let i = 0; i < n; i++) { const aa = a + rnd(-C.spread, C.spread), sp = rnd(C.speedMin, C.speedMax); G.bullets.push({ x: P.x, y: P.y - 4, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, life: rnd(C.lifeMin, C.lifeMax), pierce: 0, dmg: lv(C.damage, L), kb: C.knockback, hit: new Set(), col: '#ffd27a', r: 2.8 }); }
      G.lights.push({ x: P.x + Math.cos(a) * 24, y: P.y + Math.sin(a) * 24, r: 140, life: .08, max: .08, warm: true });
      G.shake = Math.max(G.shake, 3); w.cd = lv(C.cooldown, L) * S.cdMul; sfx('shotgun');
    }
    if (id === 'flamer') {
      const len = lv(C.length, L) * S.area, tg = nearest(P.x, P.y, len + 30);
      if (!tg) { w.on = false; continue; }
      const a = Math.atan2(tg.y - P.y, tg.x - P.x); w.aim = w.on ? w.aim + angDiff(a, w.aim) * Math.min(1, dt * 10) : a; w.on = true; P.face = Math.cos(w.aim) < 0 ? -1 : 1;
      for (let k = 0; k < 3; k++) { if (G.fires.length > 220) break; const aa = w.aim + rnd(-.28, .28), sp = rnd(len * 2.1, len * 2.8); G.fires.push({ x: P.x + Math.cos(w.aim) * 16, y: P.y - 4 + Math.sin(w.aim) * 16, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, life: .42, max: .42, r: rnd(5, 9) }); }
      if (w.cd <= 0) {
        w.cd = C.tick;
        for (const e of [...G.enemies]) { const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy); if (d < len + e.r && Math.abs(angDiff(Math.atan2(dy, dx), w.aim)) < C.cone) hitEnemy(e, lv(C.damage, L), dx / (d || 1) * 2, dy / (d || 1) * 2, '#ffb347'); }
      }
      sfx('flame');
    }
    if (id === 'boomerang' && w.cd <= 0) {
      const tg = nearest(P.x, P.y, C.range); if (!tg) { w.cd = .15; continue; }
      const n = lv(C.count, L), a = Math.atan2(tg.y - P.y, tg.x - P.x);
      for (let i = 0; i < n; i++) { const aa = a + (i - (n - 1) / 2) * .5; G.booms.push({ x: P.x, y: P.y, vx: Math.cos(aa) * C.speed, vy: Math.sin(aa) * C.speed, out: true, dist: 0, max: lv(C.distance, L) * S.area, dmg: lv(C.damage, L), rot: 0, hits: new Map() }); }
      w.cd = lv(C.cooldown, L) * S.cdMul; sfx('throw');
    }
    if (id === 'saws') {
      const n = lv(C.count, L), R = C.radius * S.area; G.sawAng += dt * lv(C.spin, L);
      for (let i = 0; i < n; i++) {
        const a = G.sawAng + i * Math.PI * 2 / n, sx = P.x + Math.cos(a) * R, sy = P.y + Math.sin(a) * R;
        for (const e of [...G.enemies]) if (e.sawCd <= 0 && Math.hypot(e.x - sx, e.y - sy) < e.r + 16) {
          e.sawCd = C.hitDelay; hitEnemy(e, lv(C.damage, L), (e.x - P.x) * .06, (e.y - P.y) * .06, '#e4ecf5');
          G.parts.push({ x: sx, y: sy, vx: rnd(-80, 80), vy: rnd(-80, 80), life: .15, max: .15, col: '#fff2b0', r: 2, glow: true });
        }
      }
    }
    if (id === 'zap' && w.cd <= 0) {
      let cur = nearest(P.x, P.y, C.range); if (!cur) { w.cd = .2; continue; }
      const hit = new Set(), pts = [[P.x, P.y - 10]], jumps = lv(C.jumps, L);
      for (let i = 0; i < jumps && cur; i++) { hit.add(cur); pts.push([cur.x, cur.y]); const c = cur; cur = nearest(c.x, c.y, C.jumpRange, hit); hitEnemy(c, lv(C.damage, L), 0, 0, '#9fd7ff'); }
      G.bolts.push({ pts, life: .18 }); pts.forEach(p => G.lights.push({ x: p[0], y: p[1], r: 90, life: .15, max: .15 }));
      w.cd = lv(C.cooldown, L) * S.cdMul; sfx('zap');
    }
    if (id === 'grenade' && w.cd <= 0) {
      const near = G.enemies.filter(e => Math.hypot(e.x - P.x, e.y - P.y) < C.range); if (!near.length) { w.cd = .2; continue; }
      for (let i = 0; i < lv(C.count, L); i++) { const e = near[ri(0, near.length - 1)]; G.nades.push({ sx: P.x, sy: P.y, tx: e.x + rnd(-20, 20), ty: e.y + rnd(-20, 20), k: 0, dur: C.flightTime, R: lv(C.radius, L) * S.area, dmg: lv(C.damage, L) }); }
      w.cd = lv(C.cooldown, L) * S.cdMul; sfx('throw');
    }
    if (id === 'aura' && w.cd <= 0) {
      const R = lv(C.radius, L) * S.area; w.cd = C.tick;
      for (const e of [...G.enemies]) if (Math.hypot(e.x - P.x, e.y - P.y) < R + e.r) hitEnemy(e, lv(C.damage, L), 0, 0, '#9be08a');
    }
  }
}

// ===== game/run.js =====
// Neue Runde starten: Werte aus Charakter + Werkstatt zusammenbauen









function newGame() {
  const B = BALANCE;
  G.char = CHARACTERS.find(c => c.id === save.sel) || CHARACTERS[0];
  G.P = { x: 0, y: 0, r: B.player.radius, hp: 0, inv: 0, face: 1, moving: false, step: 0 };
  const S = { dmgMul: 1, cdMul: 1, speed: B.player.speed, max: B.player.hp, magnet: B.player.magnet, regen: 0, armor: 0, area: 1, goldMul: 1 };
  for (const s of SHOP) { const l = shopLv(s.id); if (l && s.effect) applyMod(S, s.effect, l); }
  G.char.bonus.forEach(m => applyMod(S, m));
  G.S = S; G.P.hp = S.max;
  G.W = { [G.char.weapon]: { lvl: 1, cd: .3 } }; G.PL = {};
  for (const k of ['enemies', 'bullets', 'booms', 'nades', 'gems', 'coins', 'drops', 'parts', 'fires', 'texts', 'bolts', 'decals', 'lights']) G[k] = [];
  Object.assign(G, { t: 0, kills: 0, lvl: 1, xp: 0, next: B.xp.first, spawnAcc: 0, sawAng: 0, shake: 0, hurt: 0, nextBoss: B.boss.firstAt, runGold: 0, revived: false, pendingUps: 0 });
  G.state = 'play'; hideVeil(); $('hud').classList.remove('hidden'); $('pause').classList.remove('hidden');
  renderSlots(); audioInit();
}

// ===== game/update.js =====
// Ein Spielschritt: Bewegung, Gegner, Treffer, Einsammeln












function update(dt) {
  const P = G.P, S = G.S, B = BALANCE;
  G.t += dt;
  const [mx, my] = readInput();
  P.x += mx * S.speed * dt; P.y += my * S.speed * dt; P.moving = !!(mx || my);
  if (mx && !(G.W.flamer && G.W.flamer.on)) P.face = mx < 0 ? -1 : 1;
  if (P.moving) P.step += dt * 9;
  P.inv = Math.max(0, P.inv - dt);
  if (S.regen) P.hp = Math.min(S.max, P.hp + S.regen * dt);
  G.gemComboT -= dt; if (G.gemComboT <= 0) AC.gemCombo = 0;

  // Gegner erscheinen
  const sp = B.spawn, rate = Math.min(sp.maxPerSecond, sp.startPerSecond + G.t * sp.risePerSecond + Math.pow(G.t / sp.curveEvery, sp.curvePower));
  G.spawnAcc += rate * dt;
  while (G.spawnAcc >= 1) { G.spawnAcc--; if (G.enemies.length < sp.maxEnemies) spawn(pickType()); }
  if (G.t >= G.nextBoss) { G.nextBoss += B.boss.every; spawn('boss'); }
  if (G.t > B.batSwarm.after && Math.random() < dt * B.batSwarm.chancePerSecond) { for (let i = 0; i < B.batSwarm.size; i++) spawn('bat'); banner(TEXT.swarm); }

  updWeapons(dt);

  // Gegner laufen auf dich zu
  for (const e of G.enemies) {
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    const wob = e.def.zigzag ? Math.sin(G.t * 8 + e.wob) * e.def.zigzag : 0;
    e.x += (dx / d + (-dy / d) * wob) * e.spd * dt; e.y += (dy / d + (dx / d) * wob) * e.spd * dt;
    e.flash = Math.max(0, e.flash - dt); e.sawCd -= dt;
    if (d < e.r + P.r && P.inv <= 0) {
      const dmg = Math.max(1, e.dmg - S.armor); P.hp -= dmg; P.inv = B.player.hitInvulnerable; G.shake = Math.max(G.shake, 9); G.hurt = 1; sfx('hurt');
      G.texts.push({ x: P.x, y: P.y - 30, v: '-' + dmg, life: .7, col: '#ff6b5a' });
      if (P.hp <= 0) {
        if (shopLv('revive') && !G.revived) {
          G.revived = true; P.hp = S.max * B.revive.hpPercent; P.inv = B.revive.invulnerable; sfx('revive'); banner(TEXT.revive);
          for (const o of [...G.enemies]) if (Math.hypot(o.x - P.x, o.y - P.y) < B.revive.clearRadius && o.type !== 'boss') killEnemy(o);
          break;
        } else { P.hp = 0; gameOver(); return; }
      }
    }
  }
  // Gegner schieben sich leicht auseinander
  const E = G.enemies;
  for (let i = 0; i < E.length; i++) { const a = E[i];
    for (let j = i + 1; j < Math.min(E.length, i + 12); j++) { const b = E[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r - 4;
      if (d > 0 && d < m) { const p = (m - d) / 2 / d; a.x -= dx * p; a.y -= dy * p; b.x += dx * p; b.y += dy * p; } } }

  // Geschosse
  for (const b of G.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of [...G.enemies]) { if (b.hit.has(e)) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r + 1) { b.hit.add(e); const s = Math.hypot(b.vx, b.vy); hitEnemy(e, b.dmg, b.vx / s * b.kb, b.vy / s * b.kb);
        if (b.pierce-- <= 0) { b.life = 0; break; } } }
  }
  G.bullets = G.bullets.filter(b => b.life > 0);
  for (const b of G.booms) {
    if (b.out) { b.x += b.vx * dt; b.y += b.vy * dt; b.dist += Math.hypot(b.vx, b.vy) * dt; if (b.dist >= b.max) b.out = false; }
    else { const dx = P.x - b.x, dy = P.y - b.y, d = Math.hypot(dx, dy); if (d < 22) { b.dead = true; continue; } const rs = WEAPONS.boomerang.returnSpeed; b.x += dx / d * rs * dt; b.y += dy / d * rs * dt; }
    b.rot += dt * 20;
    for (const e of [...G.enemies]) if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 14) { const l = b.hits.get(e) || -9; if (G.t - l > .35) { b.hits.set(e, G.t); hitEnemy(e, b.dmg, (e.x - b.x) * .15, (e.y - b.y) * .15, '#f2c27a'); } }
  }
  G.booms = G.booms.filter(b => !b.dead);
  for (const n of G.nades) { n.k += dt / n.dur; if (n.k >= 1) { n.dead = true; explode(n.tx, n.ty, n.R, n.dmg); } }
  G.nades = G.nades.filter(n => !n.dead);

  // Einsammeln
  const pull = (g, fn) => { const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < S.magnet || g.pull) { g.pull = true; const s = Math.max(280, 620 - d) * dt; g.x += dx / d * s; g.y += dy / d * s; }
    if (d < P.r + 9) { g.done = true; fn(g); } };
  for (const c of G.coins) pull(c, c => { G.runGold += c.v; sfx('coin'); });
  G.coins = G.coins.filter(c => !c.done);
  for (const d of G.drops) if (Math.hypot(P.x - d.x, P.y - d.y) < P.r + 18) { d.done = true; useDrop(d); }
  G.drops = G.drops.filter(d => !d.done);
  for (const g of G.gems) { if (G.state !== 'play') break; pull(g, g => collect(g.v)); }
  G.gems = G.gems.filter(g => !g.done); if (G.gems.length > 420) G.gems.splice(0, G.gems.length - 420);

  // Effekte altern lassen
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .9; p.vy *= .9; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0); if (G.parts.length > 500) G.parts.splice(0, G.parts.length - 500);
  for (const f of G.fires) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .92; f.vy *= .92; f.life -= dt; }
  G.fires = G.fires.filter(f => f.life > 0);
  for (const x of G.texts) { x.y -= 40 * dt; x.life -= dt; } G.texts = G.texts.filter(x => x.life > 0);
  for (const b of G.bolts) b.life -= dt; G.bolts = G.bolts.filter(b => b.life > 0);
  for (const l of G.lights) l.life -= dt; G.lights = G.lights.filter(l => l.life > 0);
  for (const d of G.decals) d.a = Math.max(0, d.a - dt * .02);
  G.shake = Math.max(0, G.shake - dt * 40); G.hurt = Math.max(0, G.hurt - dt * 2.5);
}

// ===== game/draw.js =====
// Alles auf den Bildschirm malen (Reihenfolge = Ebenen von unten nach oben)










function shadow(x, y, rx, ry) { ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }

function draw() {
  const P = G.P, S = G.S, t = G.t, VW = view.w, VH = view.h;
  const sx = reduceMotion ? 0 : rnd(-G.shake, G.shake), sy = reduceMotion ? 0 : rnd(-G.shake, G.shake);
  const camX = P.x - sx, camY = P.y - sy, cx = VW / 2 - camX, cy = VH / 2 - camY;
  const vis = (x, y, m) => x + cx > -m && y + cy > -m && x + cx < VW + m && y + cy < VH + m;
  drawGround(camX, camY);

  // Blut und Brandflecken
  for (const d of G.decals) { if (!vis(d.x, d.y, 60) || d.a <= 0) continue; ctx.save(); ctx.translate(d.x + cx, d.y + cy); ctx.rotate(d.rot); ctx.fillStyle = d.scorch ? `rgba(10,10,10,${d.a})` : `rgba(90,18,14,${d.a})`; ctx.beginPath(); ctx.ellipse(0, 0, d.r, d.r * .55, 0, 0, Math.PI * 2); ctx.fill(); if (!d.scorch) { ctx.beginPath(); ctx.arc(d.r * .9, d.r * .2, d.r * .2, 0, 7); ctx.fill(); } ctx.restore(); }
  // Giftwolke
  if (G.W.aura) { const R = lv(WEAPONS.aura.radius, G.W.aura.lvl) * S.area + (reduceMotion ? 0 : Math.sin(t * 4) * 4);
    const g = ctx.createRadialGradient(P.x + cx, P.y + cy, R * .2, P.x + cx, P.y + cy, R); g.addColorStop(0, 'rgba(110,210,90,.05)'); g.addColorStop(.85, 'rgba(110,210,90,.2)'); g.addColorStop(1, 'rgba(110,210,90,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(P.x + cx, P.y + cy, R, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(140,230,110,.35)'; ctx.lineWidth = 2; ctx.stroke(); }
  // Kristalle, Gold, Fundstücke
  for (const g of G.gems) { if (!vis(g.x, g.y, 10)) continue; const x = g.x + cx, y = g.y + cy, s = g.v >= 5 ? 7.5 : g.v >= 2 ? 6 : 5;
    ctx.fillStyle = g.v >= 5 ? LOOK.gems.big : g.v >= 2 ? LOOK.gems.mid : LOOK.gems.small; ctx.strokeStyle = OUT; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * .75, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s * .75, y); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x - 1.5, y - s * .55, 2, s * .5); }
  for (const c of G.coins) { if (!vis(c.x, c.y, 10)) continue; const sq = Math.abs(Math.cos(t * 5 + c.x));
    ctx.fillStyle = LOOK.coin; ctx.strokeStyle = OUT; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(c.x + cx, c.y + cy, 6 * Math.max(.25, sq), 6, 0, 0, 7); ctx.fill(); ctx.stroke(); }
  for (const d of G.drops) { const x = d.x + cx, y = d.y + cy + Math.sin(t * 4) * 3; shadow(x, d.y + cy + 12, 10, 3); ctx.lineWidth = 2.2; ctx.strokeStyle = OUT;
    if (d.k === 'heal') { rr(ctx, x - 11, y - 9, 22, 18, 4); ctx.fillStyle = '#f0ece2'; ctx.fill(); ctx.stroke(); ctx.fillStyle = '#d8432f'; ctx.fillRect(x - 2.5, y - 6, 5, 12); ctx.fillRect(x - 6, y - 2.5, 12, 5); }
    if (d.k === 'magnet') { ctx.beginPath(); ctx.arc(x, y - 1, 8, Math.PI, 0, true); ctx.lineWidth = 9; ctx.stroke(); ctx.lineWidth = 5; ctx.strokeStyle = '#d8432f'; ctx.stroke(); ctx.fillStyle = '#cfd5de'; ctx.fillRect(x - 10.5, y - 3, 5, 5); ctx.fillRect(x + 5.5, y - 3, 5, 5); }
    if (d.k === 'bomb') { ctx.beginPath(); ctx.arc(x, y + 2, 9, 0, 7); ctx.fillStyle = '#2a2d36'; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 5, y - 5); ctx.quadraticCurveTo(x + 10, y - 12, x + 13, y - 10); ctx.stroke(); ctx.fillStyle = Math.sin(t * 20) > 0 ? '#ffd84a' : '#ff6a2a'; ctx.beginPath(); ctx.arc(x + 13, y - 10, 2.5, 0, 7); ctx.fill(); } }

  // Figuren, nach Höhe sortiert (wer weiter unten steht, ist vorne)
  const list = G.enemies.filter(e => vis(e.x, e.y, 90)); list.push(P); list.sort((a, b) => a.y - b.y);
  for (const e of list) {
    if (e === P) { const x = P.x + cx, y = P.y + cy; shadow(x, y + 20, 14, 5);
      const fr = P.moving ? Math.floor(P.step) % 2 : 0;
      if (!(P.inv > 0 && Math.floor(t * 20) % 2)) put(SPR.chars[G.char.id][fr], x, y - 4 - (P.moving ? Math.abs(Math.sin(P.step * Math.PI / 2)) * 1.5 : 0), P.face < 0);
      const w = 38; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - w / 2, y + 26, w, 5); ctx.fillStyle = P.hp / S.max < .3 ? '#ff5a42' : '#7be08a'; ctx.fillRect(x - w / 2, y + 26, w * Math.max(0, P.hp) / S.max, 5);
      continue; }
    const x = e.x + cx, y = e.y + cy, fl = e.flash > 0, fr = Math.floor(t * 6 + e.wob) % 2, flip = e.x > P.x;
    if (e.type === 'walker') { shadow(x, y + 19, 13, 4.5); put((fl ? SPR.zw : SPR.z)[e.v % SPR.z.length][fr], x, y - 4 + Math.sin(t * 6 + e.wob) * 1.2, flip); }
    else if (e.type === 'dog') { shadow(x, y + 15, 16, 4.5); put((fl ? SPR.dogw : SPR.dog)[fr], x, y - 2, flip); }
    else if (e.type === 'brute') { shadow(x, y + 28, 24, 7); put((fl ? SPR.brutew : SPR.brute)[fr], x, y - 6, flip); }
    else if (e.type === 'bat') { shadow(x, y + 18, 9, 3); drawBat(x, y - 6, t * 22 + e.wob, fl); }
    else if (e.type === 'boss') { shadow(x, y + 44, 46, 12); put(fl ? SPR.bossw : SPR.boss, x, y - 16 + Math.sin(t * 3) * 2, flip);
      const w = 110; ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(x - w / 2, y - 98, w, 8); ctx.fillStyle = '#ff5a42'; ctx.fillRect(x - w / 2, y - 98, w * e.hp / e.max, 8); }
  }
  // Waffen-Effekte
  if (G.W.saws) { const C = WEAPONS.saws, n = lv(C.count, G.W.saws.lvl), R = C.radius * S.area;
    for (let i = 0; i < n; i++) { const a = G.sawAng + i * Math.PI * 2 / n; ctx.save(); ctx.translate(P.x + Math.cos(a) * R + cx, P.y + Math.sin(a) * R + cy); ctx.rotate(t * 16); ctx.drawImage(SPR.saw.c, -20, -20, 40, 40); ctx.restore(); } }

  for (const n of G.nades) { const k = Math.min(1, n.k), x = n.sx + (n.tx - n.sx) * k + cx, y = n.sy + (n.ty - n.sy) * k + cy, h = Math.sin(k * Math.PI) * 70;

  for (const l of G.lights) L.push({ x: l.x, y: l.y, r: l.r, a: Math.min(1, l.life / l.max + .2), warm: l.warm });
  for (const e of G.enemies) if (e.type === 'boss') L.push({ x: e.x, y: e.y - 50, r: 80, a: .5 });
  lighting(cx, cy, L, BALANCE.light.darkness + fl);

  // Schadenszahlen, Warnung bei wenig Leben, Joystick
  ctx.font = '700 15px Rubik, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const x of G.texts) { ctx.globalAlpha = Math.min(1, x.life * 2); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(x.v, x.x + cx, x.y + cy); ctx.fillStyle = x.col; ctx.fillText(x.v, x.x + cx, x.y + cy); }
  ctx.globalAlpha = 1;
  const low = P.hp / S.max < .3;

function drawMenuBG(dt) {

}

// ===== ui/menus.js =====
// Alle Menüs: Start, Charaktere, Werkstatt, Stufenaufstieg, Pause, Game Over















function showVeil(html) { $('box').innerHTML = html; $('veil').classList.remove('hidden'); $('veil').scrollTop = 0; }

const goldLine = v => `<div class="goldline"><img src="${icon('coin')}" alt="">${v}</div>`;

const soundLabel = () => save.muted ? TEXT.soundOff : TEXT.soundOn;
const toMenu = () => { G.state = 'menu'; $('hud').classList.add('hidden'); $('pause').classList.add('hidden'); };

function menu() {
  toMenu();
  const c = CHARACTERS.find(c => c.id === save.sel) || CHARACTERS[0];
  showVeil(`<h1>${TEXT.title}</h1>
    <img class="portrait" src="${portrait(c.id)}" alt="${c.name}">
    <p class="small">${c.name}, ${c.title}</p>
    ${goldLine(save.gold)}
    <button class="go" id="play">${TEXT.play}</button>
    <div class="row2"><button class="sec" id="chars">${TEXT.characters}</button><button class="sec" id="shop">${TEXT.shop}</button></div>
    ${save.best ? `<p class="small">${TEXT.record}: ${fmtTime(save.best.t)} ${TEXT.survived}, ${save.best.kills} ${TEXT.kills}</p>` : ''}

}
function charsUI() {
  toMenu();
  showVeil(`<h2>${TEXT.characters}</h2>${goldLine(save.gold)}<div class="list">${CHARACTERS.map(c => {
    const own = save.chars[c.id], sel = save.sel === c.id;
    const btn = sel ? `<button class="buy ok" disabled>${TEXT.chosen}</button>` : own ? `<button class="buy ok" data-sel="${c.id}">${TEXT.choose}</button>` : `<button class="buy" data-buy="${c.id}" ${save.gold < c.price ? 'disabled' : ''}>${coinImg()}${c.price}</button>`;
    return `<div class="item ${sel ? 'sel' : ''}"><img src="${portrait(c.id)}" alt=""><span class="tx"><b>${c.name}</b><span class="d">${c.title}. ${TEXT.startsWith} ${WEAPONS[c.weapon].name}. ${c.bonusText}.</span></span>${btn}</div>`;
  }).join('')}</div><button class="go" id="back">${TEXT.back}</button>`);

}
function shopUI() {
  toMenu();
  showVeil(`<h2>${TEXT.shop}</h2><p class="small">${TEXT.shopSub}</p>${goldLine(save.gold)}<div class="list">${SHOP.map(s => {
    const l = shopLv(s.id), price = shopPrice(s);
    const btn = l >= s.max ? `<button class="buy ok" disabled>${TEXT.done}</button>` : `<button class="buy" data-up="${s.id}" ${save.gold < price ? 'disabled' : ''}>${coinImg()}${price}</button>`;
    return `<div class="item"><img src="${icon(s.icon)}" alt=""><span class="tx"><b>${s.name}</b><span class="d">${s.desc}</span><span class="pips">${Array.from({ length: s.max }, (_, i) => `<i class="${i < l ? 'f' : ''}"></i>`).join('')}</span></span>${btn}</div>`;
  }).join('')}</div><button class="go" id="back">${TEXT.back}</button>`);

function showUps() {

      <button class="go" id="go">${TEXT.resume}</button><div class="row2"><button class="sec" id="mute">${soundLabel()}</button><button class="sec" id="quit">${TEXT.giveUp}</button></div>`);

function gameOver() {
  if (G.state === 'over') return;
  G.state = 'over'; joy.on = false; $('pause').classList.add('hidden');
  const Gd = BALANCE.gold, earned = Math.round((G.runGold + Math.floor(G.t / Gd.bonusEverySeconds) + Math.floor(G.kills / Gd.bonusEveryKills)) * G.S.goldMul);
  save.gold += earned;

  setTimeout(() => {
    showVeil(`<h1>${TEXT.dead}</h1><p class="stat">${fmtTime(G.t)} ${TEXT.survived}</p><p>${G.kills} ${TEXT.kills} · ${TEXT.level} ${G.lvl}</p>
      ${goldLine('+' + earned + ' Gold')}<p>${isBest ? TEXT.newRecord : `${TEXT.record}: ${fmtTime(save.best.t)} · ${save.best.kills} ${TEXT.kills}`}</p>
      <button class="go" id="go">${TEXT.again}</button><div class="row2"><button class="sec" id="shop">${TEXT.shop}</button><button class="sec" id="home">${TEXT.menu}</button></div>`);
    $('go').onclick = () => { sfx('click'); newGame(); };
    $('shop').onclick = () => { sfx('click'); shopUI(); };
    $('home').onclick = () => { sfx('click'); menu(); };

// ===== engine/input.js =====
// Steuerung: Daumen irgendwo hinlegen und ziehen (oder Pfeiltasten/WASD am PC)



const joy = { on: false, bx: 0, by: 0, x: 0, y: 0, id: null, max: 55 };
const keys = {};
function setupInput(onPause) {
  cv.addEventListener('pointerdown', e => { audioInit(); if (G.state !== 'play') return; joy.on = true; joy.id = e.pointerId; joy.bx = joy.x = e.clientX; joy.by = joy.y = e.clientY; });
  addEventListener('pointermove', e => { if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
  const end = e => { if (e.pointerId === joy.id) { joy.on = false; joy.id = null; } };
  addEventListener('pointerup', end); addEventListener('pointercancel', end);
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'Escape' || e.key === 'p') onPause(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') onPause(); });
}
function readInput() {
  let dx = 0, dy = 0;
  if (joy.on) {
    dx = joy.x - joy.bx; dy = joy.y - joy.by; const d = Math.hypot(dx, dy), m = joy.max;
    if (d > m) { joy.bx = joy.x - dx / d * m; joy.by = joy.y - dy / d * m; dx = dx / d * m; dy = dy / d * m; }
    dx /= m; dy /= m; if (Math.hypot(dx, dy) < .12) { dx = 0; dy = 0; }
  }
  if (keys.arrowleft || keys.a) dx = -1; if (keys.arrowright || keys.d) dx = 1;
  if (keys.arrowup || keys.w) dy = -1; if (keys.arrowdown || keys.s) dy = 1;
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  return [dx, dy];
}

// ===== main.js =====
// Startpunkt des Spiels: alles verbinden und die Hauptschleife starten










const VERSION = '2.1.0';
addEventListener('resize', resize); resize();
setupInput(togglePause);
$('pause').onclick = togglePause;

let last = performance.now(), hudTimer = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.state === 'play') { update(dt); music(G.t); }
  if (G.P && G.state !== 'menu') draw(); else drawMenuBG(dt);
  tickBanner(dt);
  hudTimer -= dt;
  if (G.P && hudTimer <= 0 && G.state !== 'menu') { hudTimer = .1; updateHud(); }
}
buildSprites();
menu();
requestAnimationFrame(loop);
